name: Test casks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Audit
        run: |
          brew tap antonyshakirov/tap
          brew audit --cask --strict antonyshakirov/tap/hop

      - name: Install, launch briefly, and uninstall in runner temp
        run: |
          hop_test_appdir="$RUNNER_TEMP/hop-cask-apps"
          mkdir -p "$hop_test_appdir"
          brew install --cask \
            --appdir="$hop_test_appdir" \
            antonyshakirov/tap/hop
          xattr -dr com.apple.quarantine "$hop_test_appdir/Hop.app"
          "$hop_test_appdir/Hop.app/Contents/MacOS/Hop" &
          hop_test_pid=$!
          sleep 5
          kill -0 "$hop_test_pid"
          kill "$hop_test_pid"
          wait "$hop_test_pid" || true
          brew uninstall --cask antonyshakirov/tap/hop
          test ! -e "$hop_test_appdir/Hop.app"
